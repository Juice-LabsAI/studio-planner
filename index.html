<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Juice Studio Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Type scale: 12.5 · 13.5 · 15 (base) · 17 · 20 · 26 · 40 */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9ECE8; --surface-3:#DDE2DD;
  --ink:#111815; --ink-2:#36423E; --ink-3:#5B6863; --line:#D6DBD6; --line-2:#BCC4BE;
  --accent:#0B6457; --accent-ink:#FFFFFF; --accent-soft:#D5EBE6; --accent-line:#9FCFC4;
  --good:#17693F; --good-soft:#DBF0E3; --warn:#8A5000; --warn-soft:#FBEBCF; --bad:#A92E25; --bad-soft:#F8DEDA;
  --role-0:#5856CF; --role-1:#0E8A7C; --role-2:#C27405; --role-3:#C0406A; --role-4:#2F7DB5;
  --shadow:0 1px 2px rgba(17,24,21,.06),0 8px 24px rgba(17,24,21,.08);
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --fs-xs:12.5px; --fs-sm:13.5px; --fs-base:15px; --fs-md:17px; --fs-lg:20px; --fs-xl:26px;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --surface:#161C1A; --surface-2:#1E2623; --surface-3:#27312D;
    --ink:#EDF2F0; --ink-2:#C3CDC9; --ink-3:#9AA7A2; --line:#2B3532; --line-2:#3B4743;
    --accent:#52C8B3; --accent-ink:#04201B; --accent-soft:#143A33; --accent-line:#24665A;
    --good:#66D398; --good-soft:#15352A; --warn:#F3BA58; --warn-soft:#3A2D12; --bad:#F5857A; --bad-soft:#3E1D1A;
    --role-0:#9694F4; --role-1:#46C6B5; --role-2:#ECA843; --role-3:#EE7C9E; --role-4:#6DB3E6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161C1A; --surface-2:#1E2623; --surface-3:#27312D;
  --ink:#EDF2F0; --ink-2:#C3CDC9; --ink-3:#9AA7A2; --line:#2B3532; --line-2:#3B4743;
  --accent:#52C8B3; --accent-ink:#04201B; --accent-soft:#143A33; --accent-line:#24665A;
  --good:#66D398; --good-soft:#15352A; --warn:#F3BA58; --warn-soft:#3A2D12; --bad:#F5857A; --bad-soft:#3E1D1A;
  --role-0:#9694F4; --role-1:#46C6B5; --role-2:#ECA843; --role-3:#EE7C9E; --role-4:#6DB3E6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--fs-base);line-height:1.5;padding-inline:24px;padding-block:0 64px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:1360px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:var(--fs-xl)} h3{font-size:var(--fs-md);font-weight:600}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-3)}
.sub{font-size:var(--fs-xs);color:var(--ink-3);line-height:1.4;margin-top:2px}
.eyebrow{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:18px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-size:28px;line-height:1}
.brand .tc{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.sync{font-size:var(--fs-sm);color:var(--ink-2);display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--warn)}
.acct{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#account{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--ink-2)}
.auth-card{max-width:520px;margin:40px auto;padding:28px}
.auth-card h2{margin-bottom:6px}
.auth-card p{color:var(--ink-2);margin:0 0 16px}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-card .row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.auth-card .row .field{flex:1 1 220px}
.choice{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.choice button{text-align:left;display:block;width:100%;padding:14px 16px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer}
.choice button:hover:not(:disabled){border-color:var(--accent)}
.choice button b{display:block;font-size:var(--fs-base);margin-bottom:2px}
.choice button span{font-size:var(--fs-sm);color:var(--ink-3)}
.choice button:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;padding:11px 16px;border-bottom:3px solid transparent;color:var(--ink-2);font-size:var(--fs-base);font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.banner{margin-top:16px;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:var(--fs-sm)}

main{padding-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.section-head p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}

/* controls */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:var(--fs-xs)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:var(--fs-sm);color:var(--ink-2);font-weight:600}
.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:8px 10px;min-width:0;width:100%;font-size:var(--fs-base)}
.inp:hover{border-color:var(--ink-3)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.numi{text-align:right;font-variant-numeric:tabular-nums}
.inp.xs{padding:6px 8px;font-size:var(--fs-sm)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-sm);color:var(--ink-2);font-weight:500}
.toggle input{accent-color:var(--accent);width:17px;height:17px}

/* chips */
.chip{display:inline-block;font-size:var(--fs-sm);font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pitch{border:1px dashed var(--line-2);color:var(--ink-2)}
.st-confirmed{background:var(--accent-soft);color:var(--accent)}
.st-production{background:var(--warn-soft);color:var(--warn)}
.st-delivered{background:var(--surface-2);color:var(--ink-3)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-pad{padding:18px 20px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:var(--fs-xs);letter-spacing:.02em;color:var(--ink-3);font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}

/* quote builder */
.quote-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
@media (max-width:1080px){.quote-grid{grid-template-columns:1fr}}
.proj-bar{display:grid;grid-template-columns:2fr 1.4fr 1fr 1.1fr 1.1fr .7fr;gap:12px;align-items:end}
@media (max-width:900px){.proj-bar{grid-template-columns:1fr 1fr}}
.proj-switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.proj-switch select{max-width:380px}
.add-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:16px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px}
.add-row .field:first-child{flex:1 1 300px}
.lines td{vertical-align:middle}
.line-name{font-weight:600;font-size:var(--fs-base);line-height:1.35}
.line-name .muted{font-weight:500}
.line-cat{font-size:var(--fs-xs);color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.base-sel{margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:var(--fs-xs);color:var(--ink-2);font-weight:600}
.base-sel select{max-width:100%;min-width:200px;flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink-2);font-size:var(--fs-md);margin-bottom:4px}

.summary{position:sticky;top:124px;display:flex;flex-direction:column;gap:16px}
.sum-hero{padding:20px}
.sum-hero .big{font-family:var(--f-display);font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:var(--fs-sm)}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv .tot{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;font-size:var(--fs-base)}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.metric{background:var(--surface);padding:12px 16px}
.metric .v{font-family:var(--f-display);font-size:var(--fs-lg);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.metric:first-child{border-bottom-left-radius:12px}.metric:last-child{border-bottom-right-radius:12px}
.role-line{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:var(--fs-sm)}
.role-line>span:nth-child(2){font-weight:500}
.role-line .num{font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.bar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;grid-column:1/-1}
.bar>span{display:block;height:100%;border-radius:4px}
.callout{font-size:var(--fs-sm);padding:11px 13px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);line-height:1.45}
.callout b{color:var(--ink)}
.callout.warn{background:var(--warn-soft);color:var(--warn)} .callout.warn b{color:inherit}
.callout.bad{background:var(--bad-soft);color:var(--bad)} .callout.bad b{color:inherit}
.group-label{font-size:var(--fs-xs);font-weight:700;color:var(--ink-2);letter-spacing:.03em;text-transform:uppercase;padding-top:4px;border-top:1px dashed var(--line);margin-top:2px}
.group-label:first-child{border-top:0;padding-top:0;margin-top:0}

/* role tag */
.doer{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:500;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* rate card */
.cat-head td{background:var(--surface-2);padding:14px 12px}
tbody tr.cat-head:hover td{background:var(--surface-2)}
.cat-head .cn{font-family:var(--f-display);font-weight:600;font-size:var(--fs-md)}
.cat-head .cb{font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.asset{font-weight:600;font-size:var(--fs-base)}
.variant{font-size:var(--fs-sm);color:var(--ink-2);font-weight:500}
.desc{font-size:var(--fs-sm);color:var(--ink-3);max-width:52ch;margin-top:4px;line-height:1.45}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* capacity */
.cap-grid td,.cap-grid th{text-align:right}
.cap-grid td:first-child,.cap-grid th:first-child{text-align:left}
.cell{min-width:132px}
.cell .top-n{font-variant-numeric:tabular-nums;font-size:var(--fs-base)}
.cell .top-n b{font-weight:700}
.cbar{height:9px;background:var(--surface-2);border-radius:3px;margin-top:7px;position:relative;overflow:hidden;display:flex}
.cbar .s{height:100%}
.cbar .h{height:100%;background-image:repeating-linear-gradient(135deg,currentColor 0 2px,transparent 2px 5px);opacity:.6}
.pct{font-size:var(--fs-xs);font-weight:600;color:var(--ink-3);margin-top:4px}
.pct.good{color:var(--good)} .pct.warn{color:var(--warn)} .pct.bad{color:var(--bad)}
.month-nav{display:flex;gap:6px;align-items:center}
.gantt{position:relative;height:12px;background:var(--surface-2);border-radius:3px;min-width:170px}
.gantt span{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.gantt span.pitch{background:transparent;border:1.5px dashed var(--ink-3)}
.grid-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px 20px 4px}
.grid-title p{margin:0;font-size:var(--fs-sm);color:var(--ink-3)}

/* reference */
.ref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:900px){.ref-grid{grid-template-columns:1fr}}
.ref-card h3{margin-bottom:4px}
.ref-card p.hint{margin:0 0 14px;font-size:var(--fs-sm);color:var(--ink-3);max-width:80ch}
.rows{display:flex;flex-direction:column;gap:10px}
.r-row{display:grid;gap:10px;align-items:end}
.role-row{grid-template-columns:auto minmax(150px,1.5fr) minmax(150px,1.2fr) .8fr .8fr auto auto}
.person-row{grid-template-columns:auto minmax(160px,1fr) minmax(260px,2.6fr) minmax(90px,.5fr) auto}
@media (max-width:980px){.role-row,.person-row{grid-template-columns:auto 1fr 1fr}}
.chk-row{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;align-items:center}
.field .chk,.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);cursor:pointer;background:var(--surface)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.chk:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex:none;letter-spacing:.02em}
.who-row{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;font-size:var(--fs-sm);font-weight:600}
.who-row select{grid-column:1/-1}
.savebar{position:sticky;bottom:12px;z-index:10;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-weight:500}
.savebar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.savebar .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.delta-up{color:var(--bad)} .delta-down{color:var(--good)}
.compact th,.compact td{padding:8px 4px;font-size:var(--fs-sm)}
.compact th:first-child,.compact td:first-child{padding-left:0}
.compact th:last-child,.compact td:last-child{padding-right:0}
.compact .pct{margin-top:0;font-size:var(--fs-sm)}
.hist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.hist li:last-child{border-bottom:0}
.hist ul{list-style:none;margin:0;padding:0}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:9px;padding:12px 14px;color:var(--ink-2);line-height:1.8;overflow-x:auto}
.formula b{color:var(--ink);font-weight:500}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 38%,transparent);display:flex;justify-content:flex-end}
.drawer{width:min(640px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.drawer-body{padding:20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:20px}
.drawer-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0}
legend{font-size:var(--fs-sm);font-weight:700;color:var(--ink);padding:0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;border:1px solid var(--line-2);border-radius:7px;padding:6px 12px;font-size:var(--fs-sm);font-weight:500;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.preview div{background:var(--surface-2);padding:12px 14px}
.preview .v{font-family:var(--f-display);font-weight:600;font-size:var(--fs-lg);font-variant-numeric:tabular-nums;margin-top:2px}
@media (max-width:520px){.preview{grid-template-columns:1fr 1fr}}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:var(--fs-sm);font-weight:500;box-shadow:var(--shadow);transition:opacity .2s;pointer-events:none}
#toast[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/config.js"></script>
<script src="data/seed.js"></script>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0=new Intl.NumberFormat("en-IN",{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("en-IN",{maximumFractionDigits:2});
const nf3=new Intl.NumberFormat("en-IN",{maximumFractionDigits:3});
const inr=n=>{n=+n||0;return (n<0?"−":"")+"₹"+nf0.format(Math.abs(Math.round(n)));};
const inr2=n=>"₹"+nf2.format(+n||0);
const days=n=>nf3.format(Math.round((+n||0)*1000)/1000);
const num=n=>nf0.format(Math.round(+n||0));
const hrs=n=>new Intl.NumberFormat("en-IN",{maximumFractionDigits:1}).format(+n||0);
const pct=f=>isFinite(f)?Math.round(f*100)+"%":"—";
const xfmt=m=>isFinite(m)?(m>=10?m.toFixed(0):m.toFixed(1))+"×":"—";
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const parseNum=v=>{const n=parseFloat(String(v).replace(/[,₹%×\s]/g,""));return isNaN(n)?null:n;};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

const STATUSES=[["pitch","Pitch"],["confirmed","Confirmed"],["production","In production"],["delivered","Delivered"]];
const STATUS_LABEL=Object.fromEntries(STATUSES);
const PRICING=[["fixed","Fixed price"],["range","Price range"],["tbd","Quote per brief"],["free","Complimentary"],["adapt","% of base film"]];
const EMPTY_SETTINGS={credits:[],dayRate:0,hoursPerDay:8,markupFloor:1.5,targetMarkup:2.5,roles:[],categoryBlurbs:{},history:[]};

/* ---------- state ---------- */
const state={
  tab:"quote", dbState:"live",
  settings:null, jobs:[], projects:[], loaded:{settings:false,jobs:false,projects:false},
  curId:null, cur:null, dirty:false, saveTimer:null, saving:false,
  addJobId:"", addQty:1,
  includePitches:true, monthOffset:0,
  exampleBaseId:"",
  jobDraft:null, jobDraftNew:false, jobErr:"",
  sDraft:null, sDirty:false,
  armed:null
};
try{const t=localStorage.getItem("sp-tab");if(t)state.tab=t;}catch(e){}
const S=()=>state.settings||EMPTY_SETTINGS;

/* ---------- calculation engine ---------- */
const creditRate=(id,s)=>{const c=(s.credits||[]).find(c=>c.id===id);return c?(+c.rate||0):0;};
const creditName=(id,s)=>{const c=((s||S()).credits||[]).find(c=>c.id===id);return c?c.name:"—";};
const jobById=id=>state.jobs.find(j=>j.id===id);
const isAdapt=j=>j&&j.pricing&&j.pricing.type==="adapt";
const jobCredits=j=>(+j.credits||0)+(+j.buffer||0);

function jobCost(j,base,s){
  s=s||S();
  const people=(+j.effortDays||0)*(+s.dayRate||0);
  let credits=0,creditType=j.creditType,creditCost=0;
  if(isAdapt(j)){
    if(base){credits=(+j.adaptShare||0)*jobCredits(base);creditType=base.creditType;creditCost=credits*creditRate(creditType,s);}
  }else{credits=jobCredits(j);creditCost=credits*creditRate(creditType,s);}
  const ext=+j.externalCost||0;
  return {people,credits,creditType,creditCost,ext,total:people+creditCost+ext};
}
function jobSP(j,base,s){
  s=s||S();const p=j.pricing||{};
  switch(p.type){
    case "fixed":return {sp:+p.sp||0,kind:"fixed"};
    case "range":return {sp:((+p.min||0)+(+p.max||0))/2,kind:"range"};
    case "tbd":return {sp:jobCost(j,null,s).total*(+s.targetMarkup||0),kind:"suggested"};
    case "free":return {sp:0,kind:"free"};
    case "adapt":return base?{sp:(+p.pct||0)*jobSP(base,null,s).sp,kind:"adapt"}:{sp:0,kind:"adapt-nobase"};
    default:return {sp:0,kind:"none"};
  }
}
function lineCalc(l,s){
  s=s||S();const j=jobById(l.jobId);if(!j)return null;
  const base=isAdapt(j)?jobById(l.baseJobId):null;
  const c=jobCost(j,base,s),p=jobSP(j,base,s);
  const qty=Math.max(0,+l.qty||0);
  const ov=l.spOverride;const hasOv=ov!==""&&ov!=null&&isFinite(+ov);
  const unitSP=hasOv?+ov:p.sp;
  const roleDays={};(s.roles||[]).forEach(r=>{roleDays[r.id]=(+j.effortDays||0)*((+(j.split||{})[r.id]||0)/100)*qty;});
  const credits={};if(c.credits&&c.creditType)credits[c.creditType]=c.credits*qty;
  return {j,base,c,p,qty,unitSP,hasOv,sp:unitSP*qty,cost:c.total*qty,people:c.people*qty,creditCost:c.creditCost*qty,ext:c.ext*qty,days:(+j.effortDays||0)*qty,roleDays,credits};
}
function projectCalc(p,s){
  s=s||S();
  const out={gross:0,cost:0,people:0,creditCost:0,ext:0,days:0,roleDays:{},credits:{},creditCostBy:{},lines:[],missing:0};
  (s.roles||[]).forEach(r=>out.roleDays[r.id]=0);
  (p.lines||[]).forEach(l=>{
    const c=lineCalc(l,s);if(!c){out.missing++;out.lines.push({l,c:null});return;}
    out.lines.push({l,c});
    out.gross+=c.sp;out.cost+=c.cost;out.people+=c.people;out.creditCost+=c.creditCost;out.ext+=c.ext;out.days+=c.days;
    for(const k in c.roleDays)out.roleDays[k]=(out.roleDays[k]||0)+c.roleDays[k];
    for(const k in c.credits){out.credits[k]=(out.credits[k]||0)+c.credits[k];out.creditCostBy[k]=(out.creditCostBy[k]||0)+c.credits[k]*creditRate(k,s);}
  });
  out.prodRoleDays=Object.assign({},out.roleDays);out.overRoleDays={};
  const hasWork=out.lines.some(x=>x.c&&x.c.qty>0);
  (s.roles||[]).forEach(r=>{
    const d=hasWork?(+r.perProjectHours||0)/((+s.hoursPerDay)||8)+out.days*(+r.pctOfProduction||0)/100:0;
    out.overRoleDays[r.id]=d;out.roleDays[r.id]=(out.roleDays[r.id]||0)+d;
  });
  out.personDays={};
  const assign=p.assign||{};const addP=(k,d)=>{if(d>0)out.personDays[k]=(out.personDays[k]||0)+d;};
  const who=(pid)=>pid&&personById(pid,s)?pid:null;
  out.lines.forEach(({l,c})=>{if(!c)return;const rid=doerOf(c.j).id;if(!rid)return;addP(who(l.assignee)||who(assign[rid])||("u:"+rid),c.days);});
  (s.roles||[]).forEach(r=>addP(who(assign[r.id])||("u:"+r.id),out.overRoleDays[r.id]||0));
  out.discount=out.gross*((+p.discountPct||0)/100);
  out.sp=out.gross-out.discount;
  out.margin=out.sp-out.cost;
  out.marginPct=out.sp>0?out.margin/out.sp:NaN;
  out.markup=out.cost>0?out.sp/out.cost:NaN;
  return out;
}
function markupChip(sp,cost,s){
  s=s||S();
  if(!(cost>0))return '<span class="chip">—</span>';
  const m=sp/cost;
  const cls=m<(+s.markupFloor||0)?"bad":m<(+s.targetMarkup||0)?"warn":"good";
  return `<span class="chip ${cls}" title="Selling price ÷ internal cost">${xfmt(m)}</span>`;
}
const marginTxt=(sp,cost)=>sp>0?pct((sp-cost)/sp):"—";

/* calendar */
const D=s=>s?new Date(s+"T12:00:00"):null;
function wd(a,b){if(!a||!b||a>b)return 0;let n=0;const x=new Date(a);while(x<=b){const w=x.getDay();if(w!==0&&w!==6)n++;x.setDate(x.getDate()+1);}return n;}
function overlapWd(a1,b1,a2,b2){const a=a1>a2?a1:a2,b=b1<b2?b1:b2;return wd(a,b);}
const fmtDate=s=>{const d=D(s);return d?d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";};
const counted=p=>p.status!=="pitch"||state.includePitches;
function projDates(p){const a=D(p.start),b=D(p.end);return a&&b&&a<=b?{a,b,n:wd(a,b)}:null;}

function roleColor(i){return `var(--role-${i%5})`;}
const isLead=r=>!!r&&r.group==="leadership";
const personById=(id,s)=>id?((s||S()).people||[]).find(x=>x.id===id):null;
const peopleForRole=(rid,s)=>((s||S()).people||[]).filter(x=>(x.roles||[]).includes(rid));
const personCapPerDay=x=>(+x.utilisation||0)/100;
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
function personRoleIdx(x,s){const roles=(s||S()).roles||[];const i=roles.findIndex(r=>(x.roles||[]).includes(r.id));return i<0?0:i;}
function keyLabel(k,s){s=s||S();if(k.startsWith("u:")){const r=(s.roles||[]).find(r=>r.id===k.slice(2));return "Unassigned "+(r?r.name:"role");}const x=personById(k,s);return x?x.name:"Former team member";}
function keyColor(k,s){s=s||S();if(k.startsWith("u:")){const i=(s.roles||[]).findIndex(r=>r.id===k.slice(2));return roleColor(i<0?0:i);}const x=personById(k,s);return roleColor(x?personRoleIdx(x,s):0);}
const abbr=n=>{const w=String(n||"").trim().split(/\s+/);return w.length>1?w.map(x=>x[0]).join("").toUpperCase():String(n||"").slice(0,4);};
function doerOf(j){const sp=j.split||{};let best=null,bv=0,n=0;for(const k in sp){if(+sp[k]>0)n++;if(+sp[k]>bv){bv=+sp[k];best=k;}}return {id:best,mixed:n>1};}
function doerTag(j){const roles=S().roles||[];const d=doerOf(j);if(d.mixed)return '<span class="doer muted">Mixed</span>';const i=roles.findIndex(r=>r.id===d.id);if(i<0)return '<span class="doer muted">—</span>';return `<span class="doer"><span class="dot" style="background:${roleColor(i)}"></span>${esc(roles[i].name)}</span>`;}

/* ---------- local storage (this browser) ---------- */
const STORE_KEY="juice-studio-planner-v1";
const SEED=window.STUDIO_SEED||null;
function fromShape(d){
  const obj=o=>Object.entries(o||{}).map(([id,v])=>Object.assign({id},clone(v)));
  state.settings=Object.assign(clone(EMPTY_SETTINGS),clone(d.settings||{}));
  state.jobs=(Array.isArray(d.jobs)?clone(d.jobs):obj(d.jobs)).sort((a,b)=>(a.order||0)-(b.order||0));
  state.projects=Array.isArray(d.projects)?clone(d.projects):obj(d.projects);
}
function toShape(){
  const obj=arr=>Object.fromEntries(arr.map(x=>{const c=clone(x);const id=c.id;delete c.id;return [id,c];}));
  return {version:1,exportedAt:new Date().toISOString(),settings:clone(state.settings||EMPTY_SETTINGS),jobs:obj(state.jobs),projects:obj(state.projects)};
}
const SCHEMA=3;
function migrateState(){
  const s=state.settings;if(!s||(+s.schema||1)>=SCHEMA)return false;
  const v=+s.schema||1;
  if(v<2)migrateV2(s);
  if(v<3){
    s.people=s.people||[];
    if(!s.people.length)(s.roles||[]).forEach(r=>{const n=Math.max(0,Math.round(+r.headcount||0));for(let i=0;i<n;i++)s.people.push({id:uid("u"),name:n>1?`${r.name} ${i+1}`:r.name,roles:[r.id],utilisation:+r.utilisation||80});});
    s.schema=3;
    s.history=[{at:new Date().toISOString(),changes:[{label:"Team",from:"headcount per role",to:"named people ("+s.people.length+" placeholders — rename them)"}]}].concat(s.history||[]).slice(0,25);
  }
  return true;
}
function migrateV2(s){
  const roles=s.roles=s.roles||[];
  const find=(id,re)=>roles.find(r=>r.id===id)||roles.find(r=>re.test(String(r.name||"").trim()));
  const ve=find("ve",/editor/i),gd=find("gd",/designer/i),cd=find("cd",/creative\s*dir|^cd$/i);
  let pm=find("pm",/^pm$|^pm\b|project\s*man|producer/i);
  if(!pm){pm={id:"pm",name:"PM",headcount:1,utilisation:80};roles.push(pm);}
  roles.forEach(r=>{
    if(!r.group)r.group=(r===cd||r===pm)?"leadership":"production";
    if(r.perProjectHours==null)r.perProjectHours=r===cd?4:r===pm?3:0;
    if(r.pctOfProduction==null)r.pctOfProduction=r===cd?15:r===pm?10:0;
  });
  const byId={"dub-artist":pm,"pdp-copy":pm,"static":gd,"static-var":gd,"carousel":gd,"ratio":gd,"pdp-gallery":gd,"gif":ve,"ai-vo":ve,"pdp-explainer":ve,"adapt-same":ve,"adapt-cross":ve,"cgi-15":ve};
  state.jobs.forEach(j=>{
    let r=byId[j.id];
    if(!r){const n=String(j.name||"");
      r=/dubbing|artist\s*voice/i.test(n)?pm:/\bcopy\b/i.test(n)?pm:/gif|video|film|promo|voice|adapt|cgi|explainer|motion|reel/i.test(n)?ve:/static|carousel|ratio|gallery|banner|image|a\+/i.test(n+" "+(j.category||""))?gd:ve;}
    r=r||ve||gd;if(r)j.split={[r.id]:100};
  });
  s.schema=2;
  s.history=[{at:new Date().toISOString(),changes:[{label:"Role split",from:"% across roles",to:"100% to the production role"},{label:"CD / PM time",from:"part of job split",to:"hours per project + % of production"}]}].concat(s.history||[]).slice(0,25);
}
let storeOK=true;
/* ---------- shared database (Supabase) ---------- */
const CFG=window.STUDIO_CONFIG||{};
const TABLES={settings:"sp_settings",jobs:"sp_jobs",projects:"sp_quotes"};
const cloud={sb:null,user:null,channel:null,pending:0,err:"",meta:{}};
const cloudOn=()=>state.mode==="cloud";
const allowedDomain=String(CFG.allowedDomain||"").toLowerCase();
const emailAllowed=e=>!allowedDomain||String(e||"").toLowerCase().endsWith("@"+allowedDomain);
function cloudErrMsg(e){
  const c=e&&e.code,m=String(e&&e.message||"");
  if(c==="42501"||/row-level security/i.test(m))return "The database refused this change. Make sure you're signed in with your @"+(allowedDomain||"company")+" email.";
  if(c==="42P01"||c==="PGRST205"||/could not find the table|does not exist/i.test(m))return "The planner tables don't exist yet. Run supabase/schema.sql in the Supabase SQL editor.";
  if(/jwt|expired|invalid claim/i.test(m))return "Your session expired. Sign out and sign in again.";
  if(/fetch|network/i.test(m))return "Can't reach the database. Check your connection.";
  return m||"Unknown error";
}
const docData=d=>{const c=clone(d);delete c.id;return c;};
async function cloudCall(fn){
  if(!cloudOn()||state.cloudView!=="live")return true;
  cloud.pending++;setSync();
  try{const {error}=await fn();if(error)throw error;cloud.err="";return true;}
  catch(e){cloud.err=cloudErrMsg(e);toast("Not saved: "+cloud.err);return false;}
  finally{cloud.pending--;setSync();}
}
function cloudUpsert(coll,docs){
  const at=new Date().toISOString(),by=cloud.user&&cloud.user.email||null;
  const rows=docs.map(d=>({id:d.id,data:docData(d),updated_at:at,updated_by:by}));
  rows.forEach(r=>{(cloud.meta[coll]=cloud.meta[coll]||{})[r.id]={at,by};});
  return cloudCall(()=>cloud.sb.from(TABLES[coll]).upsert(rows));
}
function cloudDelete(coll,ids){return cloudCall(()=>cloud.sb.from(TABLES[coll]).delete().in("id",ids));}
function settingsDoc(){return Object.assign({id:"main"},clone(state.settings||EMPTY_SETTINGS));}
async function cloudReplaceAll(){
  const [j,p]=await Promise.all([cloud.sb.from(TABLES.jobs).select("id"),cloud.sb.from(TABLES.projects).select("id")]);
  const goneJ=(j.data||[]).map(r=>r.id).filter(id=>!state.jobs.some(x=>x.id===id));
  const goneP=(p.data||[]).map(r=>r.id).filter(id=>!state.projects.some(x=>x.id===id));
  await cloudUpsert("settings",[settingsDoc()]);
  if(state.jobs.length)await cloudUpsert("jobs",state.jobs);
  if(state.projects.length)await cloudUpsert("projects",state.projects);
  if(goneJ.length)await cloudDelete("jobs",goneJ);
  if(goneP.length)await cloudDelete("projects",goneP);
}
function pickCurrent(){
  let last=null;try{last=localStorage.getItem("sp-cur");}catch(e){}
  const p=state.projects.find(x=>x.id===state.curId)||state.projects.find(x=>x.id===last)||[...state.projects].sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0];
  state.curId=p?p.id:null;state.cur=p?clone(p):null;
}
function rowsToState(sRows,jRows,pRows){
  const main=(sRows||[]).find(r=>r.id==="main");
  state.settings=Object.assign(clone(EMPTY_SETTINGS),clone(main?main.data:{}));
  state.jobs=(jRows||[]).map(r=>Object.assign({id:r.id},clone(r.data))).sort((a,b)=>(a.order||0)-(b.order||0));
  state.projects=(pRows||[]).map(r=>Object.assign({id:r.id},clone(r.data)));
  cloud.meta={};
  [["settings",sRows],["jobs",jRows],["projects",pRows]].forEach(([c,rows])=>{cloud.meta[c]={};(rows||[]).forEach(r=>cloud.meta[c][r.id]={at:r.updated_at,by:r.updated_by});});
}
async function cloudLoad(silent){
  if(!silent){state.cloudView="loading";render();}
  const res=await Promise.all(["settings","jobs","projects"].map(c=>cloud.sb.from(TABLES[c]).select("id,data,updated_at,updated_by")));
  const err=res.map(r=>r.error).find(Boolean);
  if(err){state.cloudView="error";state.cloudMsg=cloudErrMsg(err);render();return;}
  const [sR,jR,pR]=res.map(r=>r.data||[]);
  if(!sR.length&&!jR.length&&!pR.length){state.cloudView="setup";render();return;}
  if(silent&&state.dirty)return;
  rowsToState(sR,jR,pR);
  if(!state.sDirty)state.sDraft=null;
  state.cloudView="live";
  if(migrateState()){await cloudUpsert("settings",[settingsDoc()]);await cloudUpsert("jobs",state.jobs);toast("Team updated: rename the placeholder people in Reference rates → Team");}
  pickCurrent();subscribe();render();
}
function subscribe(){
  if(cloud.channel)return;
  cloud.channel=cloud.sb.channel("studio-planner");
  Object.entries(TABLES).forEach(([coll,t])=>cloud.channel.on("postgres_changes",{event:"*",schema:"public",table:t},pl=>applyRemote(coll,pl.eventType,pl.new,pl.old)));
  cloud.channel.subscribe();
}
function applyRemote(coll,type,row,old){
  const id=(row&&row.id)||(old&&old.id);if(!id)return;
  if(type!=="DELETE")(cloud.meta[coll]=cloud.meta[coll]||{})[id]={at:row.updated_at,by:row.updated_by};
  if(coll==="settings"){
    if(type==="DELETE"||id!=="main")return;
    state.settings=Object.assign(clone(EMPTY_SETTINGS),clone(row.data));if(!state.sDirty)state.sDraft=null;
  }else{
    const arr=coll==="jobs"?state.jobs:state.projects;const i=arr.findIndex(x=>x.id===id);
    if(type==="DELETE"){
      if(i>=0)arr.splice(i,1);
      if(coll==="projects"&&id===state.curId&&!state.dirty){state.cur=null;state.curId=null;pickCurrent();}
    }else{
      if(coll==="projects"&&id===state.curId&&state.dirty)return;
      const doc=Object.assign({id},clone(row.data));
      if(i>=0)arr[i]=doc;else arr.push(doc);
      if(coll==="jobs")arr.sort((a,b)=>(a.order||0)-(b.order||0));
      if(coll==="projects"&&id===state.curId)state.cur=clone(doc);
    }
  }
  render();
}
async function afterSignIn(){
  if(!emailAllowed(cloud.user.email)){state.cloudView="denied";render();return;}
  await cloudLoad();
}
async function boot(){
  if(CFG.supabaseUrl&&CFG.supabaseAnonKey){
    state.mode="cloud";
    if(!(window.supabase&&window.supabase.createClient)){state.cloudView="error";state.cloudMsg="Couldn't load the database library. Check your connection and reload the page.";render();return;}
    const open=CFG.requireLogin===false;
    cloud.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:!open,autoRefreshToken:!open,detectSessionInUrl:!open}});
    state.cloudView="loading";render();
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.cloudView==="live")cloudLoad(true);});
    if(open){cloud.open=true;await cloudLoad();return;}
    cloud.sb.auth.onAuthStateChange((ev,sess)=>{
      if(sess&&sess.user)cloud.user=sess.user;
      if(ev==="SIGNED_IN"&&state.cloudView==="signin"){cloud.user=sess.user;setTimeout(afterSignIn,0);}
      if(ev==="SIGNED_OUT"){cloud.user=null;state.cloudView="signin";render();}
    });
    let session=null;
    try{session=(await cloud.sb.auth.getSession()).data.session;}catch(e){}
    if(session){cloud.user=session.user;await afterSignIn();}
    else{state.cloudView="signin";render();}
  }else{
    state.mode="local";loadStore();render();
  }
}
function persist(){
  try{if(state.curId)localStorage.setItem("sp-cur",state.curId);}catch(e){}
  if(cloudOn()){setSync();return;}
  try{localStorage.setItem(STORE_KEY,JSON.stringify(toShape()));storeOK=true;}
  catch(e){storeOK=false;toast("This browser blocked saving. Download a backup so nothing is lost.");}
  setSync();
}
async function replaceAllData(){persist();if(cloudOn())await cloudReplaceAll();}
function loadStore(){
  let d=null;
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)d=JSON.parse(raw);}catch(e){storeOK=false;}
  if(!d&&SEED)d=SEED;
  if(d)fromShape(d);
  if(migrateState()){persist();setTimeout(()=>toast("Team updated: rename the placeholder people in Reference rates → Team"),400);}
  state.loaded={settings:true,jobs:true,projects:true};
  state.dbState="live";

function viewSummary(p,pc){
  const s=S();const roles=s.roles||[];const hpd=+s.hoursPerDay||8;
  const prod=roles.filter(r=>!isLead(r)),lead=roles.filter(isLead);
  const maxRole=Math.max(0.0001,...roles.map(r=>pc.roleDays[r.id]||0));
  // delivery estimate, per person (unassigned work uses everyone who holds that role)
  let bottleneck=null,minDays=0;
  Object.entries(pc.personDays).forEach(([k,d])=>{
    let cap;
    if(k.startsWith("u:"))cap=peopleForRole(k.slice(2),s).reduce((a,x)=>a+personCapPerDay(x),0);
    else{const x=personById(k,s);cap=x?personCapPerDay(x):0;}
    const need=cap>0?d/cap:Infinity;if(need>minDays){minDays=need;bottleneck=k;}
  });
  const assigned=Object.values(pc.prodRoleDays||{}).reduce((a,b)=>a+b,0);
  const unassigned=pc.days-assigned;
  const line=r=>{
    const i=roles.indexOf(r);const d=pc.roleDays[r.id]||0;const own=pc.prodRoleDays[r.id]||0;
    const note=isLead(r)&&d>0?`<div class="sub" style="grid-column:1/-1;margin-top:-2px">${nf2.format(+r.perProjectHours||0)} h per project + ${nf2.format(+r.pctOfProduction||0)}% of production${own>0?` + ${days(own)} d own jobs`:""}</div>`:"";
    return `<div class="role-line"><span class="dot" style="background:${roleColor(i)}"></span><span>${esc(r.name)}</span><span class="num">${days(d)} d <span class="sub">· ${hrs(d*hpd)} h</span></span>${note}
      <div class="bar"><span style="width:${(d/maxRole)*100}%;background:${roleColor(i)}"></span></div></div>`;
  };
  const leadDays=lead.reduce((a,r)=>a+(pc.overRoleDays[r.id]||0),0);
  let est="";
  if(minDays===Infinity)est=`<div class="callout bad">No one on the team can take <b>${esc(keyLabel(bottleneck,s).replace(/^Unassigned /,""))}</b> work. Add a person with that role in Reference rates → Team.</div>`;
  else if(minDays>0)est=`<div class="callout">Fastest delivery with these assignments: <b>${Math.ceil(minDays)} working days</b>. ${esc(keyLabel(bottleneck,s))} is the bottleneck.</div>`;
  // window load
  let win="";
  const pd=projDates(p);
  const others={};
  const otherLoad=(k,a,b)=>{let t=0;state.projects.forEach(q=>{if(q.id===p.id||!counted(q))return;const qd=projDates(q);if(!qd)return;const ov=overlapWd(a,b,qd.a,qd.b);if(!ov)return;const qc=others[q.id]||(others[q.id]=projectCalc(q,s));t+=(qc.personDays[k]||0)*ov/qd.n;});return t;};
  if(pd&&Object.keys(pc.personDays).length){
    const keys=Object.keys(pc.personDays).sort((a,b)=>(a.startsWith("u:")-b.startsWith("u:"))||keyLabel(a,s).localeCompare(keyLabel(b,s)));
    const rowsW=keys.map(k=>{
      const x=k.startsWith("u:")?null:personById(k,s);
      const cap=x?pd.n*personCapPerDay(x):0;
      const other=x?otherLoad(k,pd.a,pd.b):0;
      const mine=pc.personDays[k]||0;const load=cap>0?(mine+other)/cap:Infinity;
      const cls=load>1?"bad":load>.85?"warn":"good";
      return `<tr><td><span class="dot" style="background:${keyColor(k,s)}"></span> ${x?esc(x.name):`<span style="color:var(--warn)">${esc(keyLabel(k,s))}</span>`}</td><td class="num">${days(mine)}</td><td class="num">${x?days(other):"—"}</td><td class="num">${x?days(cap):"—"}</td><td class="num"><span class="pct ${x?cls:"warn"}">${x?pct(load):"assign"}</span></td></tr>`;
    }).join("");
    win=`<div class="panel panel-pad"><div class="eyebrow" style="margin-bottom:8px">People load · ${esc(fmtDate(p.start))} – ${esc(fmtDate(p.end))} · ${pd.n} working days</div>
      <div class="table-wrap"><table class="compact"><thead><tr><th>Person</th><th class="num">This</th><th class="num">Others</th><th class="num">Cap.</th><th class="num">Load</th></tr></thead><tbody>${rowsW}</tbody></table></div>
      <div class="sub" style="margin-top:8px">"Others" = their overlapping ${state.includePitches?"confirmed, in-production and pitch":"confirmed and in-production"} quotes, spread evenly across those quotes' dates.</div></div>`;
  }else if(p.lines&&p.lines.length){
    win=`<div class="callout">Add start and delivery dates to check people's load against the rest of your pipeline.</div>`;
  }
  // who's on it
  const needRoles=roles.filter(r=>(pc.roleDays[r.id]||0)>0);
  const whoRows=needRoles.map(r=>{
    const i=roles.indexOf(r);const cur=(p.assign||{})[r.id]||"";
    const cands=peopleForRole(r.id,s).map(x=>({x,l:pd?(otherLoad(x.id,pd.a,pd.b)/Math.max(0.0001,pd.n*personCapPerDay(x))):null}));
    if(pd)cands.sort((a,b)=>a.l-b.l);
    const opts=cands.map((c,ci)=>`<option value="${esc(c.x.id)}" ${c.x.id===cur?"selected":""}>${esc(c.x.name)}${c.l!=null?` · ${pct(c.l)} booked`:""}${pd&&ci===0&&cands.length>1?" (least booked)":""}</option>`).join("");
    return `<div class="who-row"><span class="dot" style="background:${roleColor(i)}"></span><label for="as-${esc(r.id)}">${esc(r.name)}<span class="sub"> · ${days(pc.roleDays[r.id])} d</span></label>
      <select class="inp xs" id="as-${esc(r.id)}" data-k="assign" data-role="${esc(r.id)}"><option value="">${cands.length?"Unassigned":"No one has this role"}</option>${opts}</select></div>`;
  }).join("");
  const anyUn=needRoles.some(r=>!personById((p.assign||{})[r.id],s)&&peopleForRole(r.id,s).length);
  const who=needRoles.length?`<div class="panel panel-pad" style="display:flex;flex-direction:column;gap:10px">

}

/* ----- pipeline & capacity ----- */
function viewPipeline(){
  const s=S();const roles=s.roles||[];
  const now=new Date();const start=new Date(now.getFullYear(),now.getMonth()+state.monthOffset,1,12);
  const months=[...Array(6)].map((_,i)=>{const a=new Date(start.getFullYear(),start.getMonth()+i,1,12);const b=new Date(a.getFullYear(),a.getMonth()+1,0,12);return {a,b,n:wd(a,b),label:a.toLocaleDateString("en-IN",{month:"short",year:"2-digit"})};});
  const calcs={};state.projects.forEach(p=>calcs[p.id]=projectCalc(p,s));
  const load=(key,m,filter)=>{let t=0;state.projects.forEach(p=>{if(!filter(p))return;const pd=projDates(p);if(!pd)return;const ov=overlapWd(pd.a,pd.b,m.a,m.b);if(ov)t+=(calcs[p.id].personDays[key]||0)*ov/pd.n;});return t;};
  const firm=p=>p.status!=="pitch";const pitch=p=>p.status==="pitch";
  const people=s.people||[];
  const keyRow=(k)=>{
    const x=k.startsWith("u:")?null:personById(k,s);const col=keyColor(k,s);
    const cells=months.map(m=>{
      const cap=x?m.n*personCapPerDay(x):0;
      const f=load(k,m,firm),pi=state.includePitches?load(k,m,pitch):0;
      const tot=f+pi;const l=cap>0?tot/cap:(tot>0?Infinity:0);
      const cls=l>1?"bad":l>.85?"warn":"good";
      const W=Math.max(cap,tot)||1;
      if(!x)return `<td class="cell"><div class="top-n"><b>${days(tot)}</b><span class="muted"> d</span></div><div class="cbar" style="color:${col}"><span class="s" style="width:${f/W*100}%;background:${col}"></span><span class="h" style="width:${pi/W*100}%"></span></div><div class="pct ${tot?"warn":""}">${tot?"needs a person":"—"}</div></td>`;
      return `<td class="cell"><div class="top-n"><b>${days(tot)}</b><span class="muted"> / ${days(cap)} d</span></div>
        <div class="cbar" style="color:${col}"><span class="s" style="width:${f/W*100}%;background:${col}"></span><span class="h" style="width:${pi/W*100}%"></span></div>
        <div class="pct ${tot?cls:""}">${tot?(isFinite(l)?pct(l)+" booked":"no capacity"):"free"}${l>1&&isFinite(l)?` · over by ${days(tot-cap)} d`:""}</div></td>`;
    }).join("");
    const roleNames=x?(x.roles||[]).map(rid=>(roles.find(r=>r.id===rid)||{}).name).filter(Boolean).join(", "):"";
    return `<tr><td><div style="display:flex;gap:8px;align-items:center">${x?`<span class="avatar" style="background:${col}">${esc(initials(x.name))}</span>`:`<span class="dot" style="background:${col}"></span>`}<b>${esc(x?x.name:keyLabel(k,s))}</b></div><div class="sub">${x?`${esc(roleNames||"No role")} · ${esc(x.utilisation)}% utilisation`:"Pick people on these quotes"}</div></td>${cells}</tr>`;
  };
  const leadPerson=x=>isLead(roles[personRoleIdx(x,s)]);
  const roleRows=people.filter(x=>!leadPerson(x)).map(x=>keyRow(x.id)).join("");
  const leadRows=people.filter(leadPerson).map(x=>keyRow(x.id)).join("");
  const unKeys=[...new Set(Object.values(calcs).flatMap(c=>Object.keys(c.personDays).filter(k=>k.startsWith("u:")||!personById(k,s))))];
  const unRows=unKeys.filter(k=>months.some(m=>load(k,m,p=>counted(p))>0)).map(keyRow).join("");
  const prodRoles=roles.filter(r=>!isLead(r)),leadRoles=roles.filter(isLead);
  const peopleCell=c=>{const ks=Object.keys(c.personDays);if(!ks.length)return '<span class="muted">—</span>';const named=ks.filter(k=>!k.startsWith("u:")&&personById(k,s)).map(k=>esc(personById(k,s).name));const un=ks.some(k=>k.startsWith("u:")||!personById(k,s));return (named.join(", ")||"")+(un?`${named.length?" ":""}<span class="chip warn">unassigned</span>`:"");};
  const monthHead=`<thead><tr><th>Person</th>${months.map(m=>`<th>${m.label}<div class="sub" style="font-weight:500">${m.n} working days</div></th>`).join("")}</tr></thead>`;
  const creditRows=(s.credits||[]).map(c=>{
    const cells=months.map(m=>{let t=0;state.projects.forEach(p=>{if(!counted(p))return;const pd=projDates(p);if(!pd)return;const ov=overlapWd(pd.a,pd.b,m.a,m.b);if(ov)t+=(calcs[p.id].credits[c.id]||0)*ov/pd.n;});
      return `<td class="cell"><div class="top-n"><b>${num(t)}</b><span class="muted"> cr</span></div><div class="sub">${inr(t*(+c.rate||0))}</div></td>`;}).join("");
    return `<tr><td><b>${esc(c.name)} credits</b><div class="sub">${inr2(c.rate)} / credit</div></td>${cells}</tr>`;
  }).join("");

  // projects table
  const rangeA=months[0].a,rangeB=months[5].b;const span=(rangeB-rangeA)||1;
  const plist=[...state.projects].sort((a,b)=>(a.start||"9").localeCompare(b.start||"9"));
  const prow=plist.map(p=>{
    const c=calcs[p.id];const pd=projDates(p);
    let g="";if(pd){const a=Math.max(pd.a,rangeA),b=Math.min(pd.b,rangeB);if(a<=b){g=`<span class="${p.status==="pitch"?"pitch":""}" style="left:${(a-rangeA)/span*100}%;width:${Math.max(1.2,(b-a)/span*100)}%"></span>`;}}
    return `<tr>
      <td><button class="btn ghost sm" style="padding-left:0;font-weight:600;color:var(--ink)" data-action="open-project" data-id="${esc(p.id)}">${esc(p.name||"Untitled")}</button><div class="sub">${esc(p.client||"")}</div></td>
      <td><span class="pill st-${esc(p.status)}">${esc(STATUS_LABEL[p.status]||p.status)}</span></td>
      <td>${pd?`${esc(fmtDate(p.start))} – ${esc(fmtDate(p.end))}<div class="sub">${pd.n} working days</div>`:'<span class="chip warn">No dates · not counted</span>'}</td>
      <td style="min-width:170px"><div class="gantt">${g}</div></td>
      <td class="num">${inr(c.sp)}</td><td class="num">${inr(c.cost)}</td><td class="num">${markupChip(c.sp,c.cost)}</td>
      <td>${peopleCell(c)}</td>
      ${[...prodRoles,...leadRoles].map(r=>`<td class="num">${days(c.roleDays[r.id]||0)}</td>`).join("")}
    </tr>`;
  }).join("");
  const tot=plist.filter(p=>p.status!=="delivered").reduce((a,p)=>{const c=calcs[p.id];a.sp+=c.sp;a.cost+=c.cost;if(p.status==="pitch")a.pitch+=c.sp;else a.firm+=c.sp;return a;},{sp:0,cost:0,pitch:0,firm:0});

  return `<div class="section-head"><div><h2>Pipeline &amp; capacity</h2><p>Booked team days against capacity, month by month. Each quote's effort is spread evenly across its working days (Mon–Fri) between start and delivery.</p></div>
    <div class="toolbar">
      <label class="toggle"><input type="checkbox" id="pipe-pitch" data-k="includePitches" ${state.includePitches?"checked":""}> Include pitches <span class="muted">(hatched)</span></label>
      <div class="month-nav"><button class="btn sm" data-action="month" data-d="-1" aria-label="Earlier months">←</button><button class="btn sm" data-action="month" data-d="0">Today</button><button class="btn sm" data-action="month" data-d="1" aria-label="Later months">→</button></div>
    </div></div>
  <div class="panel" style="margin-bottom:18px"><div class="grid-title"><h3>Production team</h3><p>Each person's booked days from quotes they're assigned to.</p></div><div class="table-wrap"><table class="cap-grid">
    ${monthHead}
    <tbody>${roleRows||`<tr><td colspan="7" class="muted">Add people in Reference rates → Team.</td></tr>`}${creditRows?`<tr class="cat-head"><td colspan="7"><span class="eyebrow">Credits to buy</span></td></tr>`+creditRows:""}</tbody>
  </table></div></div>
  ${unRows?`<div class="panel" style="margin-bottom:18px"><div class="grid-title"><h3>Unassigned work</h3><p>Days on quotes where no one is picked for the role yet. Assign people in the Quote builder.</p></div><div class="table-wrap"><table class="cap-grid">${monthHead}<tbody>${unRows}</tbody></table></div></div>`:""}
  ${leadRows?`<div class="panel" style="margin-bottom:22px"><div class="grid-title"><h3>Leadership &amp; coordination</h3><p>Hours per project plus a share of each quote's production days, set in Reference rates → Team.</p></div><div class="table-wrap"><table class="cap-grid">${monthHead}<tbody>${leadRows}</tbody></table></div></div>`:""}
  <div class="section-head" style="margin-bottom:10px"><h3>Quotes</h3>
    <div class="legend"><span>Open pipeline <b>${inr(tot.sp)}</b></span><span>Confirmed <b>${inr(tot.firm)}</b></span><span>Pitching <b>${inr(tot.pitch)}</b></span><button class="btn sm primary" data-action="new-project">+ New quote</button></div></div>
  <div class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Quote</th><th>Status</th><th>Dates</th><th>${esc(months[0].label)} – ${esc(months[5].label)}</th><th class="num">Price</th><th class="num">Cost</th><th class="num">Markup</th><th>People</th>${[...prodRoles,...leadRoles].map(r=>`<th class="num" title="${esc(r.name)}"><span class="dot" style="background:${roleColor(roles.indexOf(r))}"></span> ${esc(abbr(r.name))} d</th>`).join("")}</tr></thead>
    <tbody>${prow||`<tr><td colspan="${8+roles.length}"><div class="empty"><strong>No quotes yet</strong>Create one in the Quote builder.</div></td></tr>`}</tbody>
  </table></div></div>`;
}

function priceCell(j,base){
  const p=j.pricing||{};const s=S();
  switch(p.type){
    case "fixed":return inr(p.sp);
    case "range":return `${inr(p.min)} – ${inr(p.max).replace("₹","")}<div class="sub">midpoint ${inr(jobSP(j).sp)}</div>`;
    case "tbd":return `<span class="muted">Quote per brief</span><div class="sub">suggest ${inr(jobSP(j).sp)} @ ${xfmt(+s.targetMarkup)}</div>`;
    case "free":return `<span class="muted">Complimentary</span>`;
    case "adapt":return `${Math.round((+p.pct||0)*100)}% of base${base?`<div class="sub">${inr(jobSP(j,base).sp)} on example</div>`:""}`;
  }
  return "—";
}

function flat(s){
  const m={};
  (s.credits||[]).forEach(c=>{m["cr:"+c.id]=[`${c.name} credit`,inr2(c.rate)];});
  m.dayRate=["Workday cost",inr(s.dayRate)];m.hours=["Hours per workday",String(s.hoursPerDay)];
  m.floor=["Markup floor",xfmt(+s.markupFloor)];m.target=["Target markup",xfmt(+s.targetMarkup)];
  (s.roles||[]).forEach(r=>{m["rn:"+r.id]=["Role name",r.name];
    m["rg:"+r.id]=[`${r.name} type`,isLead(r)?"Leadership & coordination":"Production"];m["rp:"+r.id]=[`${r.name} hours per project`,String(+r.perProjectHours||0)];m["rq:"+r.id]=[`${r.name} % of production`,(+r.pctOfProduction||0)+"%"];});
  const rn=id=>((s.roles||[]).find(r=>r.id===id)||{}).name||"?";
  (s.people||[]).forEach(x=>{m["pn:"+x.id]=["Person",x.name];m["pu:"+x.id]=[`${x.name} utilisation`,(x.utilisation||0)+"%"];m["pr:"+x.id]=[`${x.name} roles`,(x.roles||[]).map(rn).join(", ")||"none"];});
  return m;
}

function setPath(o,path,v){const k=path.split(".");let x=o;for(let i=0;i<k.length-1;i++){if(x[k[i]]==null||typeof x[k[i]]!=="object")x[k[i]]={};x=x[k[i]];}x[k[k.length-1]]=v;}
function readVal(el){
  if(el.type==="checkbox")return el.checked;
  if(el.hasAttribute("data-num")){const n=parseNum(el.value);return n==null?(el.hasAttribute("data-opt")?"":0):n;}
  return el.value;
}
function onField(e){
  const el=e.target.closest("[data-k]");if(!el)return;
  if(e.type==="input"&&(el.tagName==="SELECT"||el.type==="checkbox"||el.type==="radio"||el.type==="date"))return;
  if(e.type==="change"&&el.tagName!=="SELECT"&&el.type!=="checkbox"&&el.type!=="radio"&&el.type!=="date")return;
  const k=el.dataset.k;const v=readVal(el);
  if(k==="curId"){flushProject();state.curId=v;try{localStorage.setItem("sp-cur",v);}catch(e){}const f=state.projects.find(p=>p.id===v);state.cur=f?clone(f):null;state.armed=null;render();return;}
  if(k==="addJobId"){state.addJobId=v;return;}
  if(k==="addQty"){state.addQty=v;return;}
  if(k==="includePitches"){state.includePitches=v;render();return;}
  if(k==="exampleBaseId"){state.exampleBaseId=v;render();return;}
  if(k==="assign"){const rid=el.dataset.role;updateProject(p=>{p.assign=Object.assign({},p.assign||{});if(v)p.assign[rid]=v;else delete p.assign[rid];});return;}
  if(k==="setrole"){const x=state.sDraft.people[+el.dataset.i];const set=new Set(x.roles||[]);if(el.checked)set.add(el.value);else set.delete(el.value);x.roles=(state.sDraft.roles||[]).map(r=>r.id).filter(id=>set.has(id));state.sDirty=true;render();return;}
  if(k.startsWith("proj.")){updateProject(p=>{p[k.slice(5)]=v;});return;}
  if(k.startsWith("line.")){const id=el.dataset.id;updateProject(p=>{const l=(p.lines||[]).find(x=>x.id===id);if(l)l[k.slice(5)]=v;});return;}
  if(k.startsWith("job.")){
    const path=k.slice(4);
    if(path==="pricing.pctView")setPath(state.jobDraft,"pricing.pct",(+v||0)/100);
    else if(path==="adaptShareView")state.jobDraft.adaptShare=(+v||0)/100;
    else if(path==="doer")state.jobDraft.split=v?{[v]:100}:{};
    else setPath(state.jobDraft,path,v);
    if(path==="pricing.type"&&v==="adapt"){if(state.jobDraft.pricing.pct==null)state.jobDraft.pricing.pct=.5;if(state.jobDraft.adaptShare==null)state.jobDraft.adaptShare=.2;}
    state.jobErr="";render();return;
  }
  if(k.startsWith("set.")){setPath(state.sDraft,k.slice(4),v);state.sDirty=true;render();return;}
}

  "close-drawer"(){state.jobDraft=null;state.armed=null;render();},
  "close-drawer-bg"(el,e){if(e.target===el){state.jobDraft=null;state.armed=null;render();}},
  async "save-job"(){const j=clone(state.jobDraft);if(!String(j.name||"").trim()){state.jobErr="Give the job type a name.";render();return;}if(!String(j.category||"").trim())j.category="Other";const id=j.id;delete j.id;delete j.pricing.pctView;delete j.adaptShareView;const i=state.jobs.findIndex(x=>x.id===id);const rec=Object.assign({id},j);if(i>=0)state.jobs[i]=rec;else state.jobs.push(rec);state.jobs.sort((a,b)=>(a.order||0)-(b.order||0));const isNew=state.jobDraftNew;state.jobDraft=null;render();await dbSet("jobs/"+id,j);toast(isNew?"Added to rate card":"Rate card updated");},
  async "del-job"(){if(state.armed!=="del-job"){state.armed="del-job";render();return;}const id=state.jobDraft.id;state.jobs=state.jobs.filter(j=>j.id!==id);state.jobDraft=null;state.armed=null;render();await dbDel("jobs/"+id);toast("Job type deleted");},
  "add-credit"(){state.sDraft.credits.push({id:uid("c"),name:"New provider",rate:0});state.sDirty=true;render();},
  "rm-credit"(el){state.sDraft.credits.splice(+el.dataset.i,1);state.sDirty=true;render();},
  "add-role"(){state.sDraft.roles.push({id:uid("r"),name:"New role",group:"production",headcount:1,utilisation:80,perProjectHours:0,pctOfProduction:0});state.sDirty=true;render();},
  "rm-role"(el){const [r]=state.sDraft.roles.splice(+el.dataset.i,1);(state.sDraft.people||[]).forEach(x=>{x.roles=(x.roles||[]).filter(id=>id!==r.id);});state.sDirty=true;render();},
  "add-person"(){state.sDraft.people=state.sDraft.people||[];const pr=(state.sDraft.roles||[]).find(r=>!isLead(r));state.sDraft.people.push({id:uid("u"),name:"New person",roles:pr?[pr.id]:[],utilisation:80});state.sDirty=true;render();setTimeout(()=>{const el=$("#st-pn-"+(state.sDraft.people.length-1));if(el){el.focus();el.select();}},20);},
  "rm-person"(el){state.sDraft.people.splice(+el.dataset.i,1);state.sDirty=true;render();},
  "auto-assign"(){const s=S();const p=state.cur;if(!p)return;const pc=projectCalc(p,s);const pd=projDates(p);
    const cache={};const loadOf=x=>{if(!pd)return 0;let t=0;state.projects.forEach(q=>{if(q.id===p.id||!counted(q))return;const qd=projDates(q);if(!qd)return;const ov=overlapWd(pd.a,pd.b,qd.a,qd.b);if(!ov)return;const qc=cache[q.id]||(cache[q.id]=projectCalc(q,s));t+=(qc.personDays[x.id]||0)*ov/qd.n;});return t/Math.max(0.0001,pd.n*personCapPerDay(x));};
    const extra={};Object.entries(pc.personDays).forEach(([k,d])=>{if(!k.startsWith("u:"))extra[k]=d;});
    const capOf=x=>Math.max(0.0001,(pd?pd.n:20)*personCapPerDay(x));
    const order=[...(s.roles||[])].sort((a,b)=>(pc.roleDays[b.id]||0)-(pc.roleDays[a.id]||0));
    updateProject(q=>{q.assign=Object.assign({},q.assign||{});order.forEach(r=>{const need=pc.roleDays[r.id]||0;if(need<=0||personById(q.assign[r.id],s))return;const c=peopleForRole(r.id,s).map(x=>({x,l:loadOf(x)+(extra[x.id]||0)/capOf(x)})).sort((a,b)=>a.l-b.l)[0];if(c){q.assign[r.id]=c.x.id;extra[c.x.id]=(extra[c.x.id]||0)+need;}});});
    toast(pd?"Assigned the least-booked person for each role":"Assigned people — add dates to balance by workload");},
  "discard-settings"(){state.sDraft=null;state.sDirty=false;render();},
  async "save-settings"(){
    const a=flat(S()),b=flat(state.sDraft);const changes=[];
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{const x=a[k],y=b[k];if(!x)changes.push({label:"Added "+y[0],from:"—",to:y[1]});else if(!y)changes.push({label:"Removed "+x[0],from:x[1],to:"—"});else if(x[1]!==y[1])changes.push({label:k.startsWith("rn:")?"Role renamed":k.startsWith("pn:")?"Person renamed":y[0],from:x[1],to:y[1]});});
    const next=clone(state.sDraft);next.history=[{at:new Date().toISOString(),changes}].concat((S().history||[])).slice(0,25);
    if(!changes.length){state.sDirty=false;state.sDraft=null;render();return;}
    state.settings=next;state.sDraft=null;state.sDirty=false;render();
    await dbSet("settings/main",next);toast("Reference rates saved");
  },
  "backup"(){const d=new Date().toISOString().slice(0,10);downloadFile(`studio-planner-backup-${d}.json`,JSON.stringify(toShape(),null,2),"application/json");toast("Backup downloaded");},
  "export-seed"(){const d=toShape();d.projects={};downloadFile("seed.js","/* Juice Studio Planner — default rate card. Generated "+d.exportedAt+". Commit this to data/seed.js. */\nwindow.STUDIO_SEED = "+JSON.stringify(d,null,2)+";\n","text/javascript");toast("seed.js downloaded — replace data/seed.js in the repo");},
  "restore"(){$("#restore-file").click();},
  "reset-defaults"(){if(!SEED){toast("No data/seed.js found next to this file");return;}if(state.armed!=="reset"){state.armed="reset";render();return;}state.armed=null;fromShape(SEED);migrateState();state.sDraft=null;state.sDirty=false;const p=[...state.projects].sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""))[0];state.curId=p?p.id:null;state.cur=p?clone(p):null;render();replaceAllData().then(()=>toast("Reset to the rate card in data/seed.js"));},
  async "export-quote"(){if(!state.cur)return;const p=state.cur,s=S(),pc=projectCalc(p,s);
    const rows=[["Project",p.name],["Client",p.client],["Status",STATUS_LABEL[p.status]],["Start",p.start],["Delivery",p.end],[],["Category","Job","Variant","Base film","Qty","Unit price","Line price","Internal cost","Markup","Margin %","Workdays","Done by",...(s.roles||[]).map(r=>r.name+" days"),"Credits","Credit provider"]];
    pc.lines.forEach(({l,c})=>{if(!c)return;rows.push([c.j.category,c.j.name,c.j.variant,c.base?c.base.name+" "+(c.base.variant||""):"",c.qty,Math.round(c.unitSP),Math.round(c.sp),Math.round(c.cost),c.cost>0?(c.sp/c.cost).toFixed(2):"",c.sp>0?((c.sp-c.cost)/c.sp*100).toFixed(1):"",c.days,(()=>{const rid=doerOf(c.j).id;const x=personById(l.assignee)||personById((p.assign||{})[rid]);return x?x.name:"Unassigned";})(),...(s.roles||[]).map(r=>+(c.roleDays[r.id]||0).toFixed(3)),Math.round(c.c.credits*c.qty),c.c.credits?creditName(c.c.creditType):""]);});
    rows.push([],["Gross",Math.round(pc.gross)],["Discount",Math.round(pc.discount)],["Quote value (excl. taxes)",Math.round(pc.sp)],["Internal cost",Math.round(pc.cost)],["Margin",Math.round(pc.margin)],["Markup",pc.cost>0?pc.markup.toFixed(2):""]);
    saveCSV((p.name||"quote").replace(/[^\w\- ]+/g,"").trim()+".csv",rows);},
  async "export-rates"(){const s=S();const rows=[["Category","Job","Variant","Description","Pricing","Selling price","Internal cost","Markup","Margin %","Workdays","Credits","Buffer","Provider","External cost",...(s.roles||[]).map(r=>r.name+" %")]];
    const exBase=jobById(defaultBaseId(null));
    state.jobs.forEach(j=>{const b=isAdapt(j)?exBase:null;const c=jobCost(j,b),sp=jobSP(j,b).sp;const p=j.pricing||{};rows.push([j.category,j.name,j.variant,j.description,p.type==="adapt"?Math.round(p.pct*100)+"% of base":p.type==="range"?`${p.min}-${p.max}`:(PRICING.find(x=>x[0]===p.type)||[,""])[1],Math.round(sp),Math.round(c.total),c.total>0?(sp/c.total).toFixed(2):"",sp>0?((sp-c.total)/sp*100).toFixed(1):"",j.effortDays,isAdapt(j)?Math.round(j.adaptShare*100)+"% of base":j.credits,isAdapt(j)?"":j.buffer,creditName(j.creditType),j.externalCost||0,...(s.roles||[]).map(r=>(j.split||{})[r.id]||0)]);});
    saveCSV("juice-rate-card.csv",rows);}
};
async function saveCSV(name,rows){
  const csv=rows.map(r=>r.map(v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");
  downloadFile(name,"\uFEFF"+csv,"text/csv;charset=utf-8");toast("Exported "+name);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=actions[el.dataset.action];if(!a)return;
  if(el.dataset.action!=="close-drawer-bg")e.preventDefault();
  if(state.armed&&!["del-project","del-job","reset-defaults"].includes(el.dataset.action))state.armed=null;
  a(el,e);
});
window.addEventListener("beforeunload",()=>{flushProject();});
boot();
})();
</script>
